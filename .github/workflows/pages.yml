name: Deploy Pages

# Deploys the built forecast page held on the gh-pages branch. demo/page.html on main is only the
# template (its data block is the __DEMO_DATA__ placeholder); the working page is built from the
# Iridis forecast, agent and PPO outputs, which are not in git, by demo/synthetic_demo.py,
# demo/page_extras.py and demo/ui_variants.py (the Story page), then committed to gh-pages as
# index.html beside the CNAME. After updating gh-pages, run this workflow by hand (Actions > Deploy Pages)
# or push to main; gh-pages holds no workflow of its own, so a push there deploys nothing.
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: gh-pages
      - name: Check the page is built
        run: |
          test -s index.html && test -s CNAME
          if grep -q '__DEMO_DATA__' index.html; then echo "index.html is the unbuilt template"; exit 1; fi
          mkdir -p _site && cp index.html CNAME _site/
      - uses: actions/configure-pages@v5.0.0
      - uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4.0.5
