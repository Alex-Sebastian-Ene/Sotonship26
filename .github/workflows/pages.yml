name: Deploy Pages

# Deploys the static site held on the gh-pages branch (placeholder now, built demo page later).
# Source branch kept separate from main so the demo artifact never touches application code.
on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: gh-pages
      - uses: actions/configure-pages@v5.0.0
      - uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4.0.5
