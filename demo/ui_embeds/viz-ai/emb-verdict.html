.verdict { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; padding: 22px 18px 18px; position: relative; overflow: hidden; }
.stamp { justify-self: start; display: inline-grid; place-items: center; padding: 10px 22px; border: 4px double var(--hi); color: var(--hi); border-radius: 12px;

.dials { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; }

function delayCaveat(S) {
  const p = -S.ppo.vehicle_hours.diff, a = -S.advisor.vehicle_hours.diff, base = S.nothing.vehicle_hours.mean;
  if (a > p) return ['Advisor cuts delay more', `Moving the ships cuts vehicle delay more (${Math.round(a)} vehicle-hours a day against ${Math.round(p)}); the learned plan wins on cost and congested road-hours.`];
  return ['Delay barely moves', `The learned plan cuts about ${Math.round(p)} of ${Math.round(base).toLocaleString()} vehicle-hours of delay a day (${(p / base * 100).toFixed(1)}%); the ship-timing advisor cuts ${Math.round(a)}. Earlier runs had the advisor ahead on delay.`];
}

$('#head').innerHTML = `Verdict: <em>yes</em>, the learned plan pays its way`;
$('#sub').textContent = `On ${wins} of ${n} simulated cruise days it cost less than doing nothing, and it beat both simpler plans on most days.`;
$('#stamp').innerHTML = `<small>saves about</small>${k1(save)} a day`;
const DIALS = [
  ['none', 'Doing nothing', S.ppo.better, 'days the learned plan was cheaper'],
  ['rule', 'The simple rule', H.rule.ppo_cheaper, 'days it beat signs-and-marshals-when-full'],
  ['advisor', 'Ship-timing advisor', H.advisor.ppo_cheaper, 'days it beat moving the ships'],
];
const R = 70, C = Math.PI * R;   // semicircle
function draw(animate) {
  $('#dials').innerHTML = DIALS.map(([k, name, share, what]) => {
    const won = Math.round(share * n), off = C * (1 - share);
    return `<div class="dial" data-tip="${esc(`<b>Against ${name.toLowerCase()}</b><br>Cheaper on ${won} of ${n} test days`)}">
      <svg viewBox="0 0 180 112" role="img" aria-label="${esc(`Against ${name}: cheaper on ${won} of ${n} days`)}">
        <path class="trk" d="M20 96 A70 70 0 0 1 160 96"/>
        <path class="arc" d="M20 96 A70 70 0 0 1 160 96" style="stroke:var(--ppo);stroke-dasharray:${C};stroke-dashoffset:${animate ? C : off}" data-off="${off}"/>
        <text class="big" x="90" y="86">${Math.round(share * 100)}%</text>
        <text class="of" x="90" y="106">${won} of ${n} days</text></svg>
      <b><i class="who" style="background:var(--${k})"></i>vs ${esc(name.toLowerCase())}</b><span>${esc(what)}</span></div>`;
  }).join('');
  const run = () => { $('#dials').querySelectorAll('.arc').forEach(a => { a.style.strokeDashoffset = a.dataset.off; }); $('#vd').classList.add('shown'); };
  if (animate) requestAnimationFrame(() => requestAnimationFrame(run)); else run();
  postH();
}
draw(!REDUCED);
if (!REDUCED) { $('#vd').classList.remove('shown'); whenSeen($('#vd'), () => draw(true)); }
window.redraw = () => draw(false);
tipOn($('#vd'));
const marsh = D.ablation.ppo.cost - D.ablation.ppo_no_marshals.cost;
$('#takes').innerHTML = [[k1(save), 'saved on an average test day'], [`${(-S.ppo.corridor_hours.diff).toFixed(1)} h`, 'fewer congested road-hours a day'], [k1(-H.rule.mean), 'a day better than the simple rule']]
  .map(([b, s]) => `<div class="take"><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join('');
caveats($('#cav'), [
  ['Simulated days', `The model's own sampled cruise days (${D.dates.test.length} held-out and ${D.dates.seen.length} training dates, several draws each), not observed traffic.`],
  ['Marshals are assumed', `About ${k1(-marsh)} of the saving needs dock-gate marshals, whose +${Math.round((D.marshal_cap - 1) * 100)}% gate capacity is our assumption, not a measurement.`],
  delayCaveat(S),
  ['Our cost weights', `Pounds come from weights we set (£${D.costs.corridor_hour.toLocaleString()} per congested road-hour, £${D.costs.marshal_hour} per marshal gate-hour). The council should set its own.`],
]);
</script>
</body>
