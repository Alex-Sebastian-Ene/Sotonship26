<style>
/* Embedded overview: transparent page sized to its content, themed from <html data-theme> (harbour by default). */
:root {
  --surface: #0B1A2B; --sunk: #0F2238; --ink: #E4F0FA; --muted: #8DA6BE; --line: #1E3A57; --accent: #4CC9F0; --hi: #FFD166;

  --radius: 14px; --edge: 1px solid var(--line); --shadow: 0 10px 30px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
:root[data-theme="steam"], :root[data-theme="light"], :root[data-theme="chart"] {
  --surface: #FFFBF1; --sunk: #EFE5CD; --ink: #1D2B45; --muted: #5B6476; --line: #1D2B45; --accent: #D8473A; --hi: #D8473A;

}
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; }
body { color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; overflow-x: hidden; }
.emb { display: grid; gap: 16px; padding: 4px 2px 8px; max-width: 1300px; margin: 0 auto; }
.kicker { font: 700 .74rem var(--data); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
.kicker .pill { padding: 2px 9px; border-radius: 999px; border: var(--edge); }
h2.head { margin: 0; font-family: var(--display); font-weight: 700; font-size: clamp(1.5rem, 3.6vw, 2.5rem); line-height: 1.1; letter-spacing: -.01em; text-wrap: balance; }

.sub { margin: -6px 0 0; color: var(--muted); font-size: 1rem; }
.card { background: var(--surface); border: var(--edge); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.take { display: grid; gap: 0; padding: 10px 14px; border-radius: 12px; background: var(--sunk); border: var(--edge); min-width: 150px; flex: 1 1 180px; }
.take b { font: 700 1.35rem var(--data); line-height: 1.15; }
.take span { font-size: .82rem; color: var(--muted); }
.cav { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.cav button { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 11px; border-radius: 999px; border: 1px dashed var(--muted); background: transparent; color: var(--muted);
  font: 600 .8rem var(--body); cursor: pointer; }
.cav button i { font-style: normal; display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid currentColor; font-size: .7rem; font-weight: 800; }
.cav button[aria-expanded="true"], .cav button:hover { color: var(--ink); border-color: var(--ink); }
.cav-note { font-size: .85rem; color: var(--ink); padding: 8px 12px; border-radius: 10px; background: var(--sunk); border-left: 3px solid var(--accent); }
.cav-note[hidden] { display: none; }
.seg { display: inline-flex; border: var(--edge); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--muted); font: 700 .82rem var(--body); padding: 6px 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.tip { position: fixed; z-index: 9; pointer-events: none; padding: 6px 10px; border-radius: 8px; background: var(--ink); color: var(--surface); font-size: .8rem; line-height: 1.35; max-width: 240px; box-shadow: 0 6px 18px rgba(0,0,0,.3); }
.tip[hidden] { display: none; }
.num { font-family: var(--data); font-variant-numeric: tabular-nums; }
svg text { font-family: var(--body); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* Small multiples as bus-stop flags: the busiest lines, each with its afternoon sparkline and a status mark. */
.stops { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px 14px; padding: 18px 16px; }
@media (max-width: 560px) { .stops { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stop { display: grid; justify-items: center; gap: 6px; transition: transform .5s cubic-bezier(.3, 1.5, .5, 1), opacity .4s; }
.stops:not(.shown) .stop { transform: translateY(16px); opacity: 0; }
.flag { width: 100%; max-width: 230px; border-radius: 12px 12px 6px 6px; border: var(--edge); background: var(--surface); overflow: hidden; box-shadow: 0 6px 16px rgba(0, 0, 0, .18); }
.flag-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 6px 10px; color: #fff; }
.flag-top b { font: 700 1.5rem var(--display); line-height: 1; }
.flag-top svg { width: 20px; height: 20px; flex: none; }
.flag-body { padding: 6px 10px 8px; display: grid; gap: 2px; }
.flag-body svg { width: 100%; height: 42px; display: block; overflow: visible; }
.spark { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.spark-z { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.spark-d { fill: var(--ink); }
.flag-body .m { font: 700 1.05rem var(--data); }
.flag-body .s { font-size: .74rem; color: var(--muted); }
.pole { width: 6px; height: 26px; border-radius: 3px; background: var(--muted); }
.st-ok { background: var(--ok); } .st-late { background: var(--warn); } .st-bad { background: var(--bad); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: .8rem; color: var(--muted); padding: 0 16px 14px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 5px; }
.legend svg { width: 14px; height: 14px; }
</style>

<script>
// Shared by the embedded overviews: theme follows <html data-theme>, height is posted to the parent,
// caveat chips open one note, numbers count up, a small tooltip.
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const k1 = v => `£${(Math.abs(v) / 1000).toFixed(1)}k`;
function postH() { try { parent.postMessage({ embedH: document.documentElement.scrollHeight, id: location.hash.slice(1) }, '*'); } catch (e) { /* not embedded */ } }
addEventListener('load', postH); addEventListener('resize', postH);
new ResizeObserver(postH).observe(document.documentElement);
new MutationObserver(() => { if (window.redraw) window.redraw(); postH(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
function caveats(host, items) {
  host.innerHTML = `<div class="cav">${items.map((c, i) => `<button type="button" data-i="${i}" aria-expanded="false">${esc(c[0])}<i aria-hidden="true">?</i></button>`).join('')}</div><p class="cav-note" hidden></p>`;
  const note = host.querySelector('.cav-note');
  host.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    const open = b.getAttribute('aria-expanded') !== 'true';
    host.querySelectorAll('button').forEach(x => x.setAttribute('aria-expanded', 'false'));
    b.setAttribute('aria-expanded', String(open)); note.hidden = !open; note.textContent = open ? items[+b.dataset.i][1] : ''; postH();
  }));
}
function countUp(el, to, fmt, ms = 1100) {
  if (REDUCED) { el.textContent = fmt(to); return; }
  const t0 = performance.now();
  const step = t => { const p = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - p, 3); el.textContent = fmt(to * e); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; document.body.append(tip);
function tipOn(host) {
  host.addEventListener('pointermove', e => {
    const t = e.target.closest('[data-tip]'); if (!t) { tip.hidden = true; return; }
    tip.innerHTML = t.dataset.tip; tip.hidden = false;
    const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 6), y = e.clientY + 16 + tip.offsetHeight > innerHeight ? e.clientY - tip.offsetHeight - 10 : e.clientY + 16;
    tip.style.left = `${Math.max(6, x)}px`; tip.style.top = `${Math.max(4, y)}px`;
  });
  host.addEventListener('pointerleave', () => { tip.hidden = true; });
}
// run fn once the visual scrolls into view (the parent only shows it on the last step)
function whenSeen(el, fn) {
  if (REDUCED || !('IntersectionObserver' in window)) return fn();
  const io = new IntersectionObserver(es => { if (es.some(x => x.isIntersecting)) { io.disconnect(); fn(); } }, { threshold: .2 });
  io.observe(el);
}

const B = JSON.parse($('#data').textContent);
// Bus overviews only: area names, whole-afternoon figures weighted by journeys, the sequential lateness scale and caveats.
const AREA = { docks: 'Docks', city_centre: 'City centre', portswood: 'Portswood' };
const AREA_ORDER = ['docks', 'city_centre', 'portswood'];
const hm = s => s.slice(11, 16);
function overall(B) {
  const L = B.day, n = L.reduce((t, x) => t + x.n, 0);
  return { n, mean: L.reduce((t, x) => t + x.mean_min * x.n, 0) / n, late5: L.reduce((t, x) => t + x.share_over_5_min * x.n, 0) / n };
}
const lateBin = m => (m < 3 ? 0 : m < 6 ? 1 : m < 9 ? 2 : m < 12 ? 3 : 4);
const BIN_LABEL = ['under 3', '3–6', '6–9', '9–12', '12+'];
const sgnMin = m => `${m < 0 ? '−' : '+'}${Math.abs(m).toFixed(1)}`;
function busCaveats(host, B, extra) {
  caveats(host, [
    ['Observed, not live', `Read once a minute from bustimes.org on Sat 17 Oct 2026, ${hm(B.from)}–${hm(B.to)} (${B.polls} readings, ${B.journeys} journeys). This is not a live feed.`],
    ['Source', 'bustimes.org live vehicle positions, which republish the Bus Open Data Service (OGL v3.0). Lateness is bustimes.org\'s delay against the timetable; each journey counts once per hour.'],
    ...(extra || []),
  ]);
}

const O = overall(B), hours = [...new Set(B.lines.map(x => x.hour))].sort((a, b) => a - b);
const TOP = B.day.slice().sort((a, b) => b.n - a.n).slice(0, 8);
// status: shape and colour together, so it never rests on colour alone
const STATUS = [
  [m => m < 2, 'ok', 'On time', 'under 2 min', '<circle cx="10" cy="10" r="6" fill="#fff"/>'],
  [m => m < 5, 'late', 'Late', '2–5 min', '<path d="M10 3 L17 16 H3 Z" fill="#fff"/>'],
  [() => true, 'bad', 'Very late', '5+ min', '<path d="M10 2 L18 10 L10 18 L2 10 Z" fill="#fff"/>'],
];
const status = m => STATUS.find(s => s[0](m));
function draw(animate) {
  const all = B.lines.filter(x => TOP.some(t => t.key === x.key)), lo = Math.min(0, ...all.map(x => x.mean_min)), hi = Math.max(5, ...all.map(x => x.mean_min));
  $('#st').innerHTML = TOP.map((L, k) => {
    const st = status(L.mean_min), pts = hours.map(h => B.lines.find(x => x.key === L.key && x.hour === h)).map((x, i) => x && [i / (hours.length - 1) * 100, 30 - (x.mean_min - lo) / (hi - lo) * 28]).filter(Boolean);
    const z = 30 - (0 - lo) / (hi - lo) * 28;
    const tip = `<b>Line ${esc(L.key)}</b><br>${L.n} journeys · mean ${sgnMin(L.mean_min)} min<br>worst 1 in 10: ${sgnMin(L.p90_min)} min · ${Math.round(L.share_over_5_min * 100)}% 5+ late`;
    return `<div class="stop" style="transition-delay:${animate ? k * 70 : 0}ms" data-tip="${esc(tip)}"><div class="flag">
      <div class="flag-top st-${st[1]}"><b>${esc(L.key)}</b><svg viewBox="0 0 20 20" role="img" aria-label="${st[2]}">${st[4]}</svg></div>

        <polyline class="spark" vector-effect="non-scaling-stroke" points="${pts.map(p => p.join(',')).join(' ')}"/></svg>
        <span class="m">${sgnMin(L.mean_min)} min</span><span class="s">${L.n} journeys · ${st[2].toLowerCase()}</span></div></div><div class="pole"></div></div>`;
  }).join('');
  $('#lg').innerHTML = STATUS.map(s => `<span><i class="st-${s[1]}"><svg viewBox="0 0 20 20">${s[4]}</svg></i>${s[2]} (${s[3]} on average)</span>`).join('') + `<span>line: minutes late hour by hour, ${String(hours[0]).padStart(2, '0')}:00–${String(hours[hours.length - 1] + 1).padStart(2, '0')}:00; dashed = on time</span>`;
  if (animate) { $('#st').classList.remove('shown'); requestAnimationFrame(() => requestAnimationFrame(() => $('#st').classList.add('shown'))); } else $('#st').classList.add('shown');
  postH();
}

if (!REDUCED) whenSeen($('#st'), () => draw(true));
window.redraw = () => draw(false);
tipOn($('#st'));
const latest = TOP.slice().sort((a, b) => b.mean_min - a.mean_min)[0], best = TOP.slice().sort((a, b) => a.mean_min - b.mean_min)[0];
const veryLate = TOP.filter(x => x.mean_min >= 5).length;
$('#head').innerHTML = `<em>${veryLate} of the ${TOP.length}</em> busiest lines ran 5+ minutes late`;
$('#sub').textContent = `Line ${latest.key} was furthest behind; line ${best.key} kept closest to its timetable.`;
$('#takes').innerHTML = [[`${sgnMin(latest.mean_min)} min`, `line ${latest.key}, the latest busy line`], [`${sgnMin(best.mean_min)} min`, `line ${best.key}, the closest to time`], [`${sgnMin(O.mean)} min`, `average over all ${B.day.length} lines`]]
  .map(([b, s]) => `<div class="take"><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join('');
busCaveats($('#cav'), B, [['Small samples', `Busiest means most journeys read: from ${TOP[TOP.length - 1].n} to ${TOP[0].n} per line. Quieter lines are left out here.`]]);
