/* A station board: the busiest lines down the side, the afternoon's hours across; tiles flip in. */
.board { padding: 14px; display: grid; gap: 10px; background: #0A0E14; border: var(--edge); }

<script>
// Shared by the embedded overviews: theme follows <html data-theme>, height is posted to the parent,
// caveat chips open one note, numbers count up, a small tooltip.
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const k1 = v => `£${(Math.abs(v) / 1000).toFixed(1)}k`;
function postH() { try { parent.postMessage({ embedH: document.documentElement.scrollHeight, id: location.hash.slice(1) }, '*'); } catch (e) { /* not embedded */ } }
addEventListener('load', postH); addEventListener('resize', postH);
new ResizeObserver(postH).observe(document.documentElement);
new MutationObserver(() => { if (window.redraw) window.redraw(); postH(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
function caveats(host, items) {
  host.innerHTML = `<div class="cav">${items.map((c, i) => `<button type="button" data-i="${i}" aria-expanded="false">${esc(c[0])}<i aria-hidden="true">?</i></button>`).join('')}</div><p class="cav-note" hidden></p>`;
  const note = host.querySelector('.cav-note');
  host.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    const open = b.getAttribute('aria-expanded') !== 'true';
    host.querySelectorAll('button').forEach(x => x.setAttribute('aria-expanded', 'false'));
    b.setAttribute('aria-expanded', String(open)); note.hidden = !open; note.textContent = open ? items[+b.dataset.i][1] : ''; postH();
  }));
}
function countUp(el, to, fmt, ms = 1100) {
  if (REDUCED) { el.textContent = fmt(to); return; }
  const t0 = performance.now();
  const step = t => { const p = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - p, 3); el.textContent = fmt(to * e); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; document.body.append(tip);
function tipOn(host) {
  host.addEventListener('pointermove', e => {
    const t = e.target.closest('[data-tip]'); if (!t) { tip.hidden = true; return; }
    tip.innerHTML = t.dataset.tip; tip.hidden = false;
    const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 6), y = e.clientY + 16 + tip.offsetHeight > innerHeight ? e.clientY - tip.offsetHeight - 10 : e.clientY + 16;
    tip.style.left = `${Math.max(6, x)}px`; tip.style.top = `${Math.max(4, y)}px`;
  });
  host.addEventListener('pointerleave', () => { tip.hidden = true; });
}
// run fn once the visual scrolls into view (the parent only shows it on the last step)

  const io = new IntersectionObserver(es => { if (es.some(x => x.isIntersecting)) { io.disconnect(); fn(); } }, { threshold: .2 });
  io.observe(el);
}

const B = JSON.parse($('#data').textContent);
const rows = B.day.slice().sort((a, b) => b.n - a.n).slice(0, 8), hours = [...new Set(B.lines.map(l => l.hour))].sort((a, b) => a - b);
const cell = (k, h) => B.lines.find(l => l.key === k && l.hour === h);

const byHour = hours.map(h => ({ h, n: rows.filter(r => { const c = cell(r.key, h); return c && c.n >= 2 && c.mean_min >= 5; }).length }));
const worstH = byHour.slice().sort((a, b) => b.n - a.n)[0];
$('#head').innerHTML = `At ${String(worstH.h).padStart(2, '0')}:00, <em>${worstH.n} of ${rows.length}</em> busy lines were 5+ minutes late`;
$('#sub').textContent = 'The afternoon board for the eight busiest lines: each tile is that hour\'s average.';
const fmt = m => `${m >= 0 ? '+' : '−'}${Math.abs(m).toFixed(0)}`;
const cols = `56px repeat(${hours.length}, minmax(0, 1fr)) minmax(0, 1.2fr)`;
$('#grid').style.gridTemplateColumns = cols;
$('#grid').innerHTML = `<span class="hd">LINE</span>${hours.map(h => `<span class="hd">${String(h).padStart(2, '0')}:00</span>`).join('')}<span class="hd">ALL</span>` +
  rows.map(r => `<span class="ln">${esc(r.key)}</span>` + hours.map(h => {
    const c = cell(r.key, h);
    if (!c || c.n < 2) return `<span class="tile none" data-tip="Line ${esc(r.key)}, ${h}:00: too few buses read">–</span>`;
    const [k, ico] = cls(c.mean_min);
    return `<span class="tile ${k}" data-tip="${esc(`<b>Line ${r.key}</b>, ${String(h).padStart(2, '0')}:00–${String(h + 1).padStart(2, '0')}:00<br>average ${fmt(c.mean_min)} min · ${c.n} journeys`)}">${ico} ${fmt(c.mean_min)}</span>`;
  }).join('') + (() => { const [k, ico] = cls(r.mean_min); return `<span class="tile whole ${k}" data-tip="${esc(`<b>Line ${r.key}</b>, whole window<br>average ${fmt(r.mean_min)} min · ${Math.round(r.share_over_5_min * 100)}% of ${r.n} journeys 5+ min late`)}">${ico} ${fmt(r.mean_min)}</span>`; })()).join('');
function flip() {
  const tiles = [...$('#grid').querySelectorAll('.tile')];
  if (REDUCED) return $('#board').classList.add('flip');
  tiles.forEach((t, i) => { t.style.transitionDelay = `${(i % (hours.length + 1)) * 90 + Math.floor(i / (hours.length + 1)) * 60}ms`; });
  $('#board').classList.add('flip');
}
whenSeen($('#board'), () => requestAnimationFrame(() => requestAnimationFrame(flip)));
tipOn($('#board'));
const latest = rows.slice().sort((a, b) => b.mean_min - a.mean_min)[0], calm = rows.slice().sort((a, b) => a.mean_min - b.mean_min)[0];
$('#takes').innerHTML = [[`${String(worstH.h).padStart(2, '0')}:00`, 'the latest hour on the board'], [`line ${latest.key}`, `latest of the eight, ${fmt(latest.mean_min)} min`], [`line ${calm.key}`, `closest to time, ${fmt(calm.mean_min)} min`]]
  .map(([b, s]) => `<div class="take"><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join('');

  ['Observed, not live', `Read once a minute on Sat 17 Oct, ${B.from.slice(11, 16)}–${B.to.slice(11, 16)}. The board does not update.`],
