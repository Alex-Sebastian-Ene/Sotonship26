* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; }
body { color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; overflow-x: hidden; }

.sub { margin: -6px 0 0; color: var(--muted); font-size: 1rem; }

.take b { font: 700 1.35rem var(--data); line-height: 1.15; }
.take span { font-size: .82rem; color: var(--muted); }
.cav { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.cav button { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 11px; border-radius: 999px; border: 1px dashed var(--muted); background: transparent; color: var(--muted);
  font: 600 .8rem var(--body); cursor: pointer; }
.cav button i { font-style: normal; display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid currentColor; font-size: .7rem; font-weight: 800; }
.cav button[aria-expanded="true"], .cav button:hover { color: var(--ink); border-color: var(--ink); }
.cav-note { font-size: .85rem; color: var(--ink); padding: 8px 12px; border-radius: 10px; background: var(--sunk); border-left: 3px solid var(--accent); }
.cav-note[hidden] { display: none; }
.seg { display: inline-flex; border: var(--edge); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--muted); font: 700 .82rem var(--body); padding: 6px 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.tip { position: fixed; z-index: 9; pointer-events: none; padding: 6px 10px; border-radius: 8px; background: var(--ink); color: var(--surface); font-size: .8rem; line-height: 1.35; max-width: 240px; box-shadow: 0 6px 18px rgba(0,0,0,.3); }
.tip[hidden] { display: none; }
.num { font-family: var(--data); font-variant-numeric: tabular-nums; }
svg text { font-family: var(--body); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* A punctuality clock: the afternoon (12:00–16:00) around the dial, one ring per area, each hour coloured by minutes late. */
.clock { display: grid; grid-template-columns: minmax(0, 1fr) minmax(200px, 300px); gap: 18px; align-items: center; padding: 18px; }
.clock svg { width: 100%; max-width: 440px; height: auto; display: block; margin: 0 auto; overflow: visible; }
.seg-a { fill: none; stroke-linecap: butt; transition: opacity .45s, stroke-width .45s; }
.clock:not(.shown) .seg-a { opacity: 0; stroke-width: 0 !important; }
.face { fill: var(--sunk); stroke: var(--line); stroke-width: 2; }
.tick { stroke: var(--muted); stroke-width: 2; }
.hlab { font: 700 13px var(--data); fill: var(--muted); text-anchor: middle; }
.rlab { font: 700 11px var(--body); fill: var(--ink); paint-order: stroke; stroke: var(--sunk); stroke-width: 3px; }
.mid-b { font: 700 40px var(--data); fill: var(--ink); text-anchor: middle; }
.mid-s { font: 600 12px var(--body); fill: var(--muted); text-anchor: middle; }
.side { display: grid; gap: 10px; }
.scale { display: grid; gap: 4px; }
.scale .sw { display: flex; height: 14px; border-radius: 4px; overflow: hidden; }
.scale .sw i { flex: 1; }
.scale .lb { display: flex; justify-content: space-between; font: 600 .72rem var(--data); color: var(--muted); }
.ringkey { display: grid; gap: 6px; font-size: .85rem; }
.ringkey span { display: flex; align-items: center; gap: 8px; }
.ringkey b { font-family: var(--data); margin-left: auto; }
.ringkey em { font-style: normal; color: var(--muted); font-size: .78rem; width: 70px; }
@media (max-width: 640px) { .clock { grid-template-columns: minmax(0, 1fr); } }
</style>

<script>
// Shared by the embedded overviews: theme follows <html data-theme>, height is posted to the parent,
// caveat chips open one note, numbers count up, a small tooltip.
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const k1 = v => `£${(Math.abs(v) / 1000).toFixed(1)}k`;
function postH() { try { parent.postMessage({ embedH: document.documentElement.scrollHeight, id: location.hash.slice(1) }, '*'); } catch (e) { /* not embedded */ } }
addEventListener('load', postH); addEventListener('resize', postH);
new ResizeObserver(postH).observe(document.documentElement);
new MutationObserver(() => { if (window.redraw) window.redraw(); postH(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
function caveats(host, items) {
  host.innerHTML = `<div class="cav">${items.map((c, i) => `<button type="button" data-i="${i}" aria-expanded="false">${esc(c[0])}<i aria-hidden="true">?</i></button>`).join('')}</div><p class="cav-note" hidden></p>`;
  const note = host.querySelector('.cav-note');
  host.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    const open = b.getAttribute('aria-expanded') !== 'true';
    host.querySelectorAll('button').forEach(x => x.setAttribute('aria-expanded', 'false'));
    b.setAttribute('aria-expanded', String(open)); note.hidden = !open; note.textContent = open ? items[+b.dataset.i][1] : ''; postH();
  }));
}
function countUp(el, to, fmt, ms = 1100) {
  if (REDUCED) { el.textContent = fmt(to); return; }
  const t0 = performance.now();
  const step = t => { const p = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - p, 3); el.textContent = fmt(to * e); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; document.body.append(tip);
function tipOn(host) {
  host.addEventListener('pointermove', e => {
    const t = e.target.closest('[data-tip]'); if (!t) { tip.hidden = true; return; }
    tip.innerHTML = t.dataset.tip; tip.hidden = false;
    const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 6), y = e.clientY + 16 + tip.offsetHeight > innerHeight ? e.clientY - tip.offsetHeight - 10 : e.clientY + 16;
    tip.style.left = `${Math.max(6, x)}px`; tip.style.top = `${Math.max(4, y)}px`;
  });
  host.addEventListener('pointerleave', () => { tip.hidden = true; });
}
// run fn once the visual scrolls into view (the parent only shows it on the last step)
function whenSeen(el, fn) {
  if (REDUCED || !('IntersectionObserver' in window)) return fn();
  const io = new IntersectionObserver(es => { if (es.some(x => x.isIntersecting)) { io.disconnect(); fn(); } }, { threshold: .2 });
  io.observe(el);
}

const B = JSON.parse($('#data').textContent);
// Bus overviews only: area names, whole-afternoon figures weighted by journeys, the sequential lateness scale and caveats.
const AREA = { docks: 'Docks', city_centre: 'City centre', portswood: 'Portswood' };
const AREA_ORDER = ['docks', 'city_centre', 'portswood'];
const hm = s => s.slice(11, 16);
function overall(B) {
  const L = B.day, n = L.reduce((t, x) => t + x.n, 0);
  return { n, mean: L.reduce((t, x) => t + x.mean_min * x.n, 0) / n, late5: L.reduce((t, x) => t + x.share_over_5_min * x.n, 0) / n };
}
const lateBin = m => (m < 3 ? 0 : m < 6 ? 1 : m < 9 ? 2 : m < 12 ? 3 : 4);
const BIN_LABEL = ['under 3', '3–6', '6–9', '9–12', '12+'];
const sgnMin = m => `${m < 0 ? '−' : '+'}${Math.abs(m).toFixed(1)}`;
function busCaveats(host, B, extra) {
  caveats(host, [
    ['Observed, not live', `Read once a minute from bustimes.org on Sat 17 Oct 2026, ${hm(B.from)}–${hm(B.to)} (${B.polls} readings, ${B.journeys} journeys). This is not a live feed.`],
    ['Source', 'bustimes.org live vehicle positions, which republish the Bus Open Data Service (OGL v3.0). Lateness is bustimes.org\'s delay against the timetable; each journey counts once per hour.'],
    ...(extra || []),
  ]);
}

const O = overall(B), hours = [...new Set(B.areas.map(a => a.hour))].sort((a, b) => a - b), H0 = hours[0], NH = hours.length;
const ring = { docks: 132, city_centre: 102, portswood: 72 }, W = 26;
const pt = (a, r) => [Math.sin(a) * r, -Math.cos(a) * r];
const arc = (a0, a1, r) => { const [x0, y0] = pt(a0, r), [x1, y1] = pt(a1, r); return `M${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`; };
function draw(animate) {
  const step = 2 * Math.PI / NH, gap = 0.03, parts = [`<circle class="face" r="152"/>`];
  hours.forEach((h, i) => {
    const a = i * step; const [tx, ty] = pt(a, 158), [lx, ly] = pt(a, 166);
    parts.push(`<line class="tick" x1="${pt(a, 146)[0]}" y1="${pt(a, 146)[1]}" x2="${tx}" y2="${ty}"/><text class="hlab" x="${lx + (lx > 10 ? 2 : lx < -10 ? -2 : 0)}" y="${ly + 4}" style="text-anchor:${lx > 10 ? 'start' : lx < -10 ? 'end' : 'middle'}">${String(h).padStart(2, '0')}:00</text>`);
  });
  let k = 0;
  for (const area of AREA_ORDER) for (const h of hours) {
    const c = B.areas.find(x => x.key === area && x.hour === h); if (!c) continue;
    const i = h - H0, a0 = i * step + gap, a1 = (i + 1) * step - gap;
    const tip = `<b>${AREA[area]}, ${String(h).padStart(2, '0')}:00–${String(h + 1).padStart(2, '0')}:00</b><br>Mean ${sgnMin(c.mean_min)} min late · ${Math.round(c.share_over_5_min * 100)}% 5+ min late<br>${c.n} journeys`;
    parts.push(`<path class="seg-a" d="${arc(a0, a1, ring[area])}" style="stroke:var(--q${lateBin(c.mean_min)});stroke-width:${W}px;transition-delay:${animate ? k * 60 : 0}ms" data-tip="${esc(tip)}"/>`);
    k++;
  }
  AREA_ORDER.forEach(area => { const [x, y] = pt(-0.1, ring[area]); parts.push(`<text class="rlab" x="${x - 4}" y="${y + 4}" text-anchor="end">${AREA[area]}</text>`); });
  parts.push(`<text class="mid-b" y="8">${sgnMin(O.mean)}</text><text class="mid-s" y="28">min late on average</text>`);
  $('#dial').innerHTML = parts.join('');
  $('#dial').setAttribute('aria-label', `Average lateness ${sgnMin(O.mean)} minutes; rings for docks, city centre and Portswood, ${NH} afternoon hours around the dial`);
  $('#scale').innerHTML = `<b>Minutes late</b><div class="sw">${[0, 1, 2, 3, 4].map(i => `<i style="background:var(--q${i})"></i>`).join('')}</div><div class="lb">${BIN_LABEL.map(l => `<span>${l}</span>`).join('')}</div>`;
  $('#rk').innerHTML = AREA_ORDER.map(a => { const cs = B.areas.filter(x => x.key === a), n = cs.reduce((t, x) => t + x.n, 0), m = cs.reduce((t, x) => t + x.mean_min * x.n, 0) / n;
    return `<span><em>${a === 'docks' ? 'outer ring' : a === 'portswood' ? 'inner ring' : 'middle ring'}</em>${AREA[a]}<b>${sgnMin(m)} min</b></span>`; }).join('');
  if (animate) { $('#ck').classList.remove('shown'); requestAnimationFrame(() => requestAnimationFrame(() => $('#ck').classList.add('shown'))); } else $('#ck').classList.add('shown');
  postH();
}
draw(false);
if (!REDUCED) whenSeen($('#ck'), () => draw(true));
window.redraw = () => draw(false);
tipOn($('#ck'));
const worst = B.areas.slice().sort((a, b) => b.mean_min - a.mean_min)[0];
$('#head').innerHTML = `Buses ran late all afternoon, worst <em>${AREA[worst.key].toLowerCase()} at ${String(worst.hour).padStart(2, '0')}:00</em>`;
$('#sub').textContent = `${O.n} bus journeys read around the docks, the city centre and Portswood.`;
$('#takes').innerHTML = [[`${sgnMin(O.mean)} min`, 'average lateness, all lines'], [`${sgnMin(worst.mean_min)} min`, `${AREA[worst.key]}, ${String(worst.hour).padStart(2, '0')}:00, the worst hour`], [`${Math.round(O.late5 * 100)}%`, 'of journeys 5+ minutes late']]
  .map(([b, s]) => `<div class="take"><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join('');
busCaveats($('#cav'), B, [['Partial hours', `Readings start at ${hm(B.from)} and stop at ${hm(B.to)}, so the first and last hours are partly covered.`]]);
</script>
