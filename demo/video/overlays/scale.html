<section class="card scale">
  <h2>{{heading}}</h2>
  <div class="ports">
    <span class="port now">{{port_now}}</span>
    <span class="arrow">&rarr;</span>
    <span class="port next">{{port_a}}</span>
    <span class="port next">{{port_b}}</span>
    <span class="port next">{{port_c}}</span>
  </div>
  <p class="note">{{note}}</p>
</section>
